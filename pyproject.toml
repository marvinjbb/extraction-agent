[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "extraction-agent"
version = "0.1.0"
description = "Production-minded service for validated invoice extraction from PDFs and images."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "openai>=3.3,<3.4",
    "pillow>=12.3,<12.4",
    "pydantic>=2.13,<2.14",
    "pymupdf>=1.28,<1.29",
    "pypdf>=6.16,<6.17",
    "python-dotenv>=1.2,<1.3",
    "python-multipart>=0.0.32,<0.0.33",
    "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=9.1,<9.2",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
